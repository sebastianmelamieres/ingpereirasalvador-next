<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios (detección de Netlify Forms)</title>
  </head>
  <body>
    <!--
      Copia estática del formulario de contacto para que Netlify Forms lo detecte al publicar.
      El formulario visible (src/components/sections/ContactForm.tsx) no lleva data-netlify para que
      Netlify no reescriba el HTML que React hidrata. El nombre y los `name` de los campos deben
      coincidir con ese componente (lo verifica scripts/validate-content.mjs).
    -->
    <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="empresa-web" hidden>
      <input name="empresa-web" />
      <input name="nombre" type="text" />
      <input name="email" type="email" />
      <input name="telefono" type="tel" />
      <select name="servicio"></select>
      <textarea name="mensaje"></textarea>
    </form>
  </body>
</html>
