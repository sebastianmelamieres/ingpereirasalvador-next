# Next.js con static export: `npm run build` genera el sitio en out/
# (y, en postbuild, out/_headers con la Content-Security-Policy: ver scripts/generate-headers.mjs)
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Headers de seguridad para todas las páginas (los mismos del sitio original).
# La Content-Security-Policy NO va acá: depende del HTML generado y se escribe en out/_headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Imágenes: cache de una semana, como /assets/img/* en el original
# (si se reemplaza una foto con el mismo nombre, se actualiza sola).
# /_next/static/* (JS, CSS y la fuente) ya lo cachea el adaptador de Next en Netlify: no se repite acá.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
